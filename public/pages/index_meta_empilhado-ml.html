<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Koala Brands | Mercado Livre</title>
  <link rel="stylesheet" href="../styles/style_meta_empilhado-ml.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="icon" href="../images/logo_koalaBrands.png" type="image/x-icon">

</head>
<body class="geral pagina-barras">

<!-- MENU HAMBURGUER - visível apenas no mobile -->
<div class="menu-hamburguer-container">
  <div class="hamburguer" id="hamburguer">&#9776;</div>
  <div class="menu-slide" id="menuSlide">
    <div class="fechar-menu" id="fecharMenu">&times;</div>
    <a href="../pages/index_meta_vendas.html" class="nav-link">Meta Vendas Geral</a>
    <a href="../pages/index_meta_empilhado-sites.html" class="nav-link">Meta Vendas Site</a>
    <a href="../pages/index_meta_empilhado-ml.html" class="nav-link">Metas Venda Mercado Livre</a>
    <a href="../pages/index_meta_empilhado-outros.html" class="nav-link">Meta Vendas Outros</a>
  </div>
</div>

  <div class="wrapper-dashboard">

    <img src="../images/logo_koalaBrands.png" alt="Logo Koala Brands" class="logo-koala" />

    <div class="refresh-icon-container">
      <img id="botaoRefresh" src="../images/refresh.png" alt="Atualizar" style="width: 24px; cursor: pointer;" />
    </div>

    <nav class="nav-menu" aria-label="Menu de navegação principal">
      <a href="../pages/index_meta_vendas.html" class="nav-item">Meta Vendas Geral</a>
      <a href="../pages/index_meta_empilhado-sites.html" class="nav-item">Meta Vendas Site</a>
      <a href="../pages/index_meta_empilhado-ml.html" class="nav-item">Metas Venda Mercado Livre</a>
      <a href="../pages/index_meta_empilhado-outros.html" class="nav-item">Meta Vendas Outros</a>
    </nav>

    <div class="layout-container">
      <main class="conteudo-dashboard">

        <h1>Metas Mercado Livre</h1>

        <hr class="">

        <div id="graficosContainer" class="graficos-container">

        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="../scrypts/barras_empilhadas-ml.js"></script>

  <script>
    const hamburguer = document.getElementById('hamburguer');
    const menuSlide = document.getElementById('menuSlide');
    const fecharMenu = document.getElementById('fecharMenu');
  
    hamburguer.addEventListener('click', () => {
      menuSlide.classList.add('aberto');
    });
  
    fecharMenu.addEventListener('click', () => {
      menuSlide.classList.remove('aberto');
    });
  </script>
  

</body>
</html>
